name: Package Firefox Extension

on:
  workflow_dispatch:
  push:
    branches:
      - chrome-extension
    paths:
      - "ChromeExtension/**"
      - ".github/workflows/package-firefox-extension.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create clean Firefox extension ZIP
        run: |
          cd ChromeExtension
          zip -X -r ../ChessAi-Firefox.zip . -x "*/.*" ".*" "__MACOSX/*"
          cd ..
          unzip -l ChessAi-Firefox.zip
          unzip -Z1 ChessAi-Firefox.zip | grep -qx "manifest.json"

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChessAi-Firefox
          path: ChessAi-Firefox.zip
          if-no-files-found: error
