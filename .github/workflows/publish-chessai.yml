name: Publish ChessAi Orion study page
on:
  push:
    branches: [chrome-extension]
    paths:
      - 'ChromeExtension/**'
      - '.github/workflows/publish-chessai.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Download Stockfish Lite single-threaded browser engine
        run: |
          npm pack stockfish@19.0.1
          mkdir -p package site
          tar -xzf stockfish-19.0.1.tgz -C package package/bin/stockfish-19-lite-single.js package/bin/stockfish-19-lite-single.wasm
          cp ChromeExtension/analysis.html site/index.html
          cp package/package/bin/stockfish-19-lite-single.js site/
          cp package/package/bin/stockfish-19-lite-single.wasm site/
          cat > site/README.txt <<'EOF'
          ChessAi Study uses Stockfish.js 19 Lite single-threaded.
          Stockfish is licensed under GPL-3.0. Source: https://github.com/nmrugg/stockfish.js
          This page is intended for chess study and post-game analysis.
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
