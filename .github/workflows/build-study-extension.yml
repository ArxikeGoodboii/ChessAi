name: Build ChessAI Study Helper

on:
  workflow_dispatch:
  push:
    paths:
      - "orion-study-extension/**"
      - ".github/workflows/build-study-extension.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate extension files
        run: |
          test -f orion-study-extension/manifest.json
          test -f orion-study-extension/content.js
          python -m json.tool orion-study-extension/manifest.json > /dev/null

      - name: Download Stockfish lite single-threaded engine
        run: |
          npm pack stockfish@19.0.1 --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP/stockfish-19.0.1.tgz" | grep -q 'package/bin/stockfish-19-lite-single.js'
          tar -tzf "$RUNNER_TEMP/stockfish-19.0.1.tgz" | grep -q 'package/bin/stockfish-19-lite-single.wasm'
          tar -xzf "$RUNNER_TEMP/stockfish-19.0.1.tgz" -C "$RUNNER_TEMP" \
            package/bin/stockfish-19-lite-single.js \
            package/bin/stockfish-19-lite-single.wasm \
            package/Copying.txt
          cp "$RUNNER_TEMP/package/bin/stockfish-19-lite-single.js" orion-study-extension/
          cp "$RUNNER_TEMP/package/bin/stockfish-19-lite-single.wasm" orion-study-extension/
          cp "$RUNNER_TEMP/package/Copying.txt" orion-study-extension/STOCKFISH-LICENSE.txt

      - name: Package extension
        run: |
          cd orion-study-extension
          zip -r ../ChessAI-Study-Helper.zip manifest.json content.js README.md CHANGELOG.md stockfish-19-lite-single.js stockfish-19-lite-single.wasm STOCKFISH-LICENSE.txt

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-Study-Helper
          path: ChessAI-Study-Helper.zip
          if-no-files-found: error
