name: Build ChessAI Study Helper

on:
  workflow_dispatch:
  push:
    paths:
      - "orion-study-extension/**"
      - ".github/workflows/build-study-extension.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate extension files
        run: |
          test -f orion-study-extension/manifest.json
          test -f orion-study-extension/content.js
          test -f orion-study-extension/engine.js
          python -m json.tool orion-study-extension/manifest.json > /dev/null

      - name: Build worker-free chess engine bundle
        run: |
          npm install --no-save chess.js@1.4.0 esbuild@0.25.0
          npx esbuild orion-study-extension/engine.js --bundle --format=iife --global-name=ChessAIEngine --outfile=orion-study-extension/engine.bundle.js
          cp node_modules/chess.js/LICENSE orion-study-extension/CHESSJS-LICENSE.txt
          test -s orion-study-extension/engine.bundle.js

      - name: Package extension
        run: |
          cd orion-study-extension
          zip -r ../ChessAI-Study-Helper.zip manifest.json content.js engine.js engine.bundle.js README.md CHANGELOG.md CHESSJS-LICENSE.txt

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-Study-Helper
          path: ChessAI-Study-Helper.zip
          if-no-files-found: error
