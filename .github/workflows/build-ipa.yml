name: Build Ghostly IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Ghostly/**"
      - "Ghostly.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project Ghostly.xcodeproj \
            -scheme Ghostly \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Ghostly.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Ghostly.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Ghostly-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghostly-unsigned-IPA
          path: Ghostly-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
